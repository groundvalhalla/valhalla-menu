<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valhalla Ground | Menú</title>
<style>
:root{--g:#f2c94c;--bg:#090909;--card:#151515;--muted:#c9c9c9;--line:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:780px;margin:auto;padding:16px 16px 120px}
.hero{border:1px solid #65531e;border-radius:22px;padding:28px 18px;text-align:center;background:linear-gradient(145deg,#050505,#242424)}.small{font-size:12px;letter-spacing:2px;color:var(--g);font-weight:900}.hero h1{font-size:34px;margin:8px 0}.sub{font-size:18px;font-weight:800}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:0;background:#090909;z-index:5}.tabs button{border:1px solid #444;background:#171717;color:#fff;border-radius:13px;padding:12px 14px;white-space:nowrap;font-weight:800}.tabs .active{background:var(--g);color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column}.emoji{font-size:34px}.name{font-size:18px;font-weight:900;margin-top:8px}.desc{color:var(--muted);font-size:13px;line-height:1.45;margin-top:7px;flex:1}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px}.price{color:var(--g);font-size:22px;font-weight:900}.add{border:0;background:var(--g);color:#111;border-radius:10px;padding:10px 12px;font-weight:900}.badge{display:inline-block;margin-top:10px;background:var(--g);color:#111;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:900}
.info{margin-top:16px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;line-height:1.6}.cartbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(748px,calc(100% - 28px));background:#171717;border:1px solid #555;border-radius:18px;padding:10px;z-index:10}.cartbar button{width:100%;border:0;background:var(--g);color:#111;border-radius:13px;padding:14px;font-weight:900;font-size:15px}
.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{background:#171717;border:1px solid #555;border-radius:20px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.item{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #333;padding:12px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{width:36px;height:36px;border-radius:9px;border:1px solid #555;background:#252525;color:#fff;font-size:20px}.box input,.box textarea,.box select{width:100%;margin-top:8px;background:#202020;color:#fff;border:1px solid #555;border-radius:10px;padding:11px;font-size:16px}.send{width:100%;border:0;background:#25D366;color:#071a0c;border-radius:13px;padding:14px;margin-top:12px;font-weight:900}.close{width:100%;padding:12px;border-radius:11px;background:#252525;color:#fff;border:1px solid #555;margin-top:12px}.notice{background:#201d12;border:1px solid #5e5021;border-radius:14px;padding:13px;margin:12px 0;font-size:13px}
@media(max-width:540px){.grid{grid-template-columns:1fr}.hero h1{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="small">HAMBURGUESAS • HOT DOGS • ALITAS • MÁS</div><h1>🔥 VALHALLA GROUND 🔥</h1><div class="sub">Hecho al Carbón</div></section>
<nav class="tabs">
<button class="active" data-cat="hamb">🍔 Hamburguesas</button><button data-cat="hot">🌭 Hot Dogs</button><button data-cat="alitas">🍗 Alitas</button><button data-cat="carne">🥩 Carne Asada</button><button data-cat="papas">🍟 Papas</button><button data-cat="esp">🔥 Especiales</button><button data-cat="beb">🥤 Bebidas</button>
</nav>
<main id="products" class="grid"></main>
<section class="info"><div>📞 <b>Pedidos:</b> 221 238 5265</div><div>🕐 <b>Horario:</b> Jueves a Lunes de 6:00 p.m. a 12:00 a.m.</div><div>📍 <b>Dirección:</b> 2 Norte #50, Loma Bonita Caleras, 72100 Puebla, Pue.</div><div>🏠 <b>CONTAMOS CON SERVICIO A DOMICILIO</b></div></section>
</div>
<div class="cartbar"><button id="openCart">🛒 Ver pedido · <span id="count">0</span> productos · $<span id="total">0</span></button></div>
<div id="modal" class="modal"><div class="box"><div id="content"></div><button class="close" id="close">Cerrar</button></div></div>
<script>
const dressings=["Piña habanero","Mango habanero","Ranch","Salsa macha","BBQ","Ajo parmesano","Buffalo","Habanero tatemado"];
const P=[
{c:"hamb",e:"🍔",n:"Hamburguesa Tradicional",p:69,d:"Carne, tocino, jamón, queso manchego, cebolla caramelizada, jitomate y aderezo.",pack:1,ingredientExtra:1},
{c:"hamb",e:"🍔",n:"Hamburguesa Hawaiana",p:79,d:"Carne, tocino, jamón, piña, salchicha, queso manchego, cebolla caramelizada, jitomate y aderezo.",pack:1,ingredientExtra:1},
{c:"hamb",e:"🍔",n:"Hamburguesa Especial",p:95,d:"Doble carne, tocino, salchicha, jamón, queso manchego, cebolla caramelizada, jitomate y aderezo.",pack:1,ingredientExtra:1},
{c:"hamb",e:"🍔",n:"Hamburguesa Mexa",p:165,d:"Doble carne, tocino, salchicha, longaniza, guacamole, lechuga y cebolla caramelizada.",pack:1,ingredientExtra:1},
{c:"hot",e:"🌭",n:"Hot Dog Tradicional",p:65,d:"Salchicha, tocino, jamón, lechuga, cebolla caramelizada y aderezo.",pack:1,ingredientExtra:1},
{c:"hot",e:"🌭",n:"Hot Dog Hawaiano",p:80,d:"Salchicha, tocineta, piña, queso, lechuga, cebolla caramelizada y aderezo.",pack:1,ingredientExtra:1},
{c:"alitas",e:"🍗",n:"Alitas al Carbón – 8 pzas",p:69,d:"Incluye 1 aderezo.",dress:1},
{c:"alitas",e:"🍗",n:"Kilo de Alitas",p:260,d:"Incluye todos los aderezos."},
{c:"carne",e:"🥩",n:"1 kg de Carne Asada o Combinado",p:340,d:"Incluye salsas, queso asado, cebolla, guacamole, tortillas, pepinos, limones y refresco de 2 L."},
{c:"carne",e:"🌮",n:"Taco 1 pza",p:22,d:"Taco de carne asada o longaniza."},
{c:"carne",e:"🌮",n:"Taco Combinado 1 pza",p:25,d:"Combinación de tacos de carne asada y longaniza."},
{c:"carne",e:"🫓",n:"Mulitas",p:45,d:"Mulitas preparadas con carne asada y queso."},
{c:"papas",e:"🍟",n:"Orden de Papas a la Francesa Chicas",p:50,d:"Papas fritas preparadas con queso, cátsup, mayonesa y salsa."},
{c:"papas",e:"🍟",n:"Orden de Papas a la Francesa Grandes",p:70,d:"Papas fritas preparadas con queso, cátsup, mayonesa y salsa."},
{c:"papas",e:"🍟",n:"Salchipapas Grandes",p:95,d:"Papas fritas, salchichas, queso, cátsup, mayonesa y salsa."},
{c:"esp",e:"🧀",n:"Nachos",p:100,d:"Totopos, frijoles, queso amarillo, carne asada, longaniza, guacamole, salsa y limones."},
{c:"esp",e:"🌭",n:"Choripán",p:95,d:"Chorizo argentino, carne, queso y guacamole."},
{c:"beb",e:"🥤",n:"Coca Cola 600 ml",p:null,d:"Precio pendiente."},
{c:"beb",e:"🧃",n:"Boing 500 ml",p:null,d:"Precio pendiente."},
{c:"beb",e:"🥤",n:"Familia Coca Cola · diferentes sabores",p:null,d:"Precio pendiente."}
];
let cart={};const $=s=>document.querySelector(s),money=n=>n.toLocaleString("es-MX");
function render(cat){$("#products").innerHTML=P.map((x,i)=>x.c!==cat?"":`<article class="card"><div class="emoji">${x.e}</div><div class="name">${x.n}</div><div class="desc">${x.d}</div>${x.pack?'<div class="badge">Incluye papas + 1 aderezo</div>':''}${x.dress?'<div class="badge">Incluye 1 aderezo</div>':''}${x.ingredientExtra?'<div class="badge">Ingrediente extra +$15</div>':''}<div class="bottom"><span class="price">${x.p===null?"Consultar":"$"+money(x.p)}</span>${x.p===null?'<span style="color:#aaa;font-size:12px">Precio pendiente</span>':`<button class="add" data-add="${i}">+ Agregar</button>`}</div></article>`).join("")}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-cat]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.cat)});
function addOptions(i){let x=P[i],h=`<h2>${x.e} ${x.n}</h2><p style="color:#c9c9c9">${x.d}</p>`;if(x.pack||x.dress)h+=`<b>Elige tu aderezo incluido:</b><select id="dress"><option value="">Seleccionar aderezo</option>${dressings.map(d=>`<option>${d}</option>`).join("")}</select><div class="notice">¿Quieres un aderezo extra?</div><select id="extraDress"><option value="">No, solo el incluido</option><option value="1">Sí, agregar aderezo extra +$15</option></select>`;if(x.ingredientExtra)h+=`<div class="notice">¿Quieres agregar un ingrediente extra?</div><select id="extra"><option value="">No</option><option value="1">Sí, agregar ingrediente extra +$15</option></select>`;h+=`<button class="send" id="confirm" data-i="${i}">Agregar al pedido</button>`;$("#content").innerHTML=h;$("#modal").classList.add("show")}
$("#products").onclick=e=>{let b=e.target.closest("[data-add]");if(b)addOptions(+b.dataset.add)};
function update(){let n=0,t=0;Object.values(cart).forEach(x=>{n+=x.q;t+=x.q*(x.p+(x.extra?15:0)+(x.extraDress?15:0))});$("#count").textContent=n;$("#total").textContent=money(t)}
function cartHTML(){let a=Object.entries(cart),h="<h2>🛒 Tu pedido</h2>";if(!a.length)return h+"<p style='color:#aaa'>Tu pedido está vacío.</p>";let t=0;a.forEach(([k,x])=>{let s=x.q*(x.p+(x.extra?15:0)+(x.extraDress?15:0));t+=s;h+=`<div class="item"><div><b>${x.n}</b><br><small>$${money(x.p)} c/u${x.dress?` · Aderezo: ${x.dress}`:""}${x.extraDress?" · Aderezo extra +$15":""}${x.extra?" · Ingrediente extra +$15":""} · Subtotal $${money(s)}</small></div><div class="qty"><button data-m="${k}">−</button><b>${x.q}</b><button data-p="${k}">+</button></div></div>`});return h+`<h2 style="text-align:right;color:#f2c94c">TOTAL: $${money(t)}</h2><input id="name" placeholder="Tu nombre"><input id="address" placeholder="Domicilio / referencia"><textarea id="notes" rows="3" placeholder="Notas del pedido (opcional)"></textarea><button class="send" id="send">📲 Enviar pedido por WhatsApp</button>`}
$("#openCart").onclick=()=>{$("#content").innerHTML=cartHTML();$("#modal").classList.add("show")};$("#close").onclick=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{
let p=e.target.closest("[data-p]"),m=e.target.closest("[data-m]");if(p){cart[p.dataset.p].q++;update();$("#content").innerHTML=cartHTML();return}if(m){cart[m.dataset.m].q--;if(cart[m.dataset.m].q<=0)delete cart[m.dataset.m];update();$("#content").innerHTML=cartHTML();return}
let c=e.target.closest("#confirm");if(c){let i=+c.dataset.i,x=P[i],d=$("#dress")?.value||"",ex=$("#extra")?.value==="1",ed=$("#extraDress")?.value==="1";if((x.pack||x.dress)&&!d){alert("Selecciona un aderezo.");return}let k=i+"|"+d+"|"+(ed?"ed":"")+"|"+(ex?"x":"");if(!cart[k])cart[k]={...x,q:0,dress:d,extra:ex,extraDress:ed};cart[k].q++;update();$("#modal").classList.remove("show");return}
let s=e.target.closest("#send");if(s){let lines=["🔥 PEDIDO VALHALLA GROUND",""],t=0;Object.values(cart).forEach(x=>{let u=x.p+(x.extra?15:0)+(x.extraDress?15:0),z=x.q*u;t+=z;lines.push(`${x.q} x ${x.n} — $${money(z)}`);if(x.dress)lines.push(`   Aderezo: ${x.dress}`);if(x.extraDress)lines.push("   + Aderezo extra: $15");if(x.extra)lines.push("   + Ingrediente extra: $15")});lines.push("",`TOTAL: $${money(t)}`);let n=$("#name")?.value.trim(),a=$("#address")?.value.trim(),no=$("#notes")?.value.trim();if(n)lines.push(`Nombre: ${n}`);if(a)lines.push(`Domicilio/referencia: ${a}`);if(no)lines.push(`Notas: ${no}`);window.open("https://wa.me/522212385265?text="+encodeURIComponent(lines.join("\n")),"_blank")}};
render("hamb");update();
</script>
</body></html>
